<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Check-list ERL Maquinaria · GESEME</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --blue:#006FC0;
    --blue-dark:#004E8A;
    --grey-bg:#F4F6F8;
    --grey-line:#D9D9D9;
    --grey-text:#404040;
    --ok:#1C8A4B;
    --warn:#C0392B;
    --card:#FFFFFF;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI',Calibri,Arial,sans-serif;
    background:var(--grey-bg);
    color:var(--grey-text);
    padding-bottom:140px;
  }
  header.topbar{
    position:sticky; top:0; z-index:50;
    background:var(--blue);
    color:#fff;
    padding:14px 20px;
    display:flex; align-items:center; justify-content:space-between;
    flex-wrap:wrap; gap:10px;
    box-shadow:0 2px 6px rgba(0,0,0,.15);
  }
  header.topbar .title{
    font-weight:700; font-size:16px; letter-spacing:.2px;
  }
  header.topbar .title small{
    display:block; font-weight:400; font-size:11px; opacity:.85; letter-spacing:.5px;
  }
  header.topbar .progress-wrap{
    flex:1; min-width:180px; max-width:320px;
    display:flex; align-items:center; gap:8px;
  }
  header.topbar .progress-bar{
    flex:1; height:8px; background:rgba(255,255,255,.25); border-radius:4px; overflow:hidden;
  }
  header.topbar .progress-fill{
    height:100%; background:#fff; width:0%; transition:width .2s ease;
  }
  header.topbar .progress-label{
    font-size:12px; white-space:nowrap;
  }
  header.topbar button{
    background:#fff; color:var(--blue-dark); border:none; border-radius:6px;
    padding:10px 18px; font-weight:700; font-size:13px; cursor:pointer;
    box-shadow:0 1px 3px rgba(0,0,0,.2);
  }
  header.topbar button:hover{background:#eef4fb;}
  header.topbar button:disabled{opacity:.6; cursor:default;}

  main{max-width:960px; margin:0 auto; padding:20px 16px 40px;}

  .card{
    background:var(--card); border:1px solid var(--grey-line); border-radius:8px;
    margin-bottom:16px; overflow:hidden;
  }
  .card h2.banner{
    background:var(--blue); color:#fff; font-size:13px; font-weight:700;
    padding:10px 14px; margin:0; letter-spacing:.3px;
  }
  .card .body{padding:14px 16px;}

  .field-grid{
    display:grid; grid-template-columns:1fr 1fr; gap:12px 20px;
  }
  @media (max-width:640px){ .field-grid{grid-template-columns:1fr;} }
  .field{display:flex; flex-direction:column; gap:4px;}
  .field label{font-size:12px; font-weight:700; color:var(--grey-text);}
  .field input[type=text], .field textarea{
    border:1px solid var(--grey-line); border-radius:5px; padding:8px 10px;
    font-size:14px; font-family:inherit; color:var(--grey-text); background:#fcfcfc;
  }
  .field input[type=text]:focus, .field textarea:focus{
    outline:none; border-color:var(--blue); background:#fff;
  }
  .field.span2{grid-column:1 / -1;}
  .ce-toggle{display:flex; gap:10px;}
  .ce-toggle label{
    display:flex; align-items:center; gap:6px; font-weight:400; font-size:13px;
    border:1px solid var(--grey-line); border-radius:5px; padding:7px 14px; cursor:pointer;
  }
  .ce-toggle input{accent-color:var(--blue);}

  .sig-row{
    display:flex; flex-direction:column; gap:12px;
    padding:20px 0; border-top:1px solid #eee;
  }
  .sig-row:first-of-type{border-top:none; padding-top:0;}
  .sig-field{width:100%; display:flex; flex-direction:column; gap:4px;}
  .sig-field label{font-size:12px; font-weight:700;}
  .sig-field input[type=text]{
    border:1px solid var(--grey-line); border-radius:5px; padding:8px 10px; font-size:14px; font-family:inherit;
  }
  .sig-pad-wrap{width:100%; display:flex; flex-direction:column; gap:8px; align-items:flex-start;}
  canvas.sig-pad{
    display:block; width:100%; max-width:760px; height:auto; aspect-ratio:880/320;
    border:2px dashed #9bb8d3; border-radius:8px; background:#fcfdff;
    touch-action:none; cursor:crosshair;
  }
  button.sig-clear{
    background:#fff; border:1px solid var(--grey-line); border-radius:6px; padding:9px 16px;
    font-size:13px; color:#666; cursor:pointer;
  }
  button.sig-clear:hover{background:#f5f5f5;}

  .subhead{
    background:var(--grey-line); color:var(--grey-text); font-weight:700; font-style:italic;
    font-size:12.5px; padding:6px 14px; margin:0;
  }

  .item-row{
    display:grid; grid-template-columns:34px 1fr 200px; gap:10px;
    align-items:start; padding:10px 14px; border-top:1px solid #eee;
  }
  .item-row:first-of-type{border-top:none;}
  .item-row .ref{
    font-size:12px; font-weight:700; color:#fff; background:var(--grey-text);
    border-radius:4px; text-align:center; padding:4px 0; align-self:flex-start;
  }
  .item-row.answered .ref{background:var(--blue);}
  .item-row .qtext{font-size:13.5px; line-height:1.35; padding-top:3px;}
  .item-row .qtext .newtag{
    display:inline-block; margin-left:6px; font-size:9.5px; font-weight:700;
    color:var(--blue-dark); background:#e4f0fb; border-radius:3px; padding:1px 5px; vertical-align:middle;
  }
  .answers{display:flex; flex-direction:column; gap:6px;}
  .pill-group{display:flex; gap:4px;}
  .pill-group label{
    flex:1; text-align:center; font-size:11px; font-weight:700; padding:5px 0;
    border:1px solid var(--grey-line); border-radius:4px; cursor:pointer; user-select:none;
    color:#888;
  }
  .pill-group input{position:absolute; opacity:0; width:0; height:0;}
  .pill-group label.si.sel{background:var(--ok); border-color:var(--ok); color:#fff;}
  .pill-group label.no.sel{background:var(--warn); border-color:var(--warn); color:#fff;}
  .pill-group label.cp.sel{background:#E8A33D; border-color:#E8A33D; color:#fff;}
  .pill-group label.na.sel{background:#888; border-color:#888; color:#fff;}
  .answers input[type=text]{
    border:1px solid var(--grey-line); border-radius:4px; padding:5px 8px; font-size:12px; font-family:inherit;
  }
  .answers input[type=text]::placeholder{color:#bbb;}

  footer.note{
    max-width:960px; margin:0 auto; padding:0 16px 30px; font-size:12px; color:#888; text-align:center;
  }

  .toast{
    position:fixed; bottom:90px; left:50%; transform:translateX(-50%);
    background:#222; color:#fff; padding:12px 22px; border-radius:6px; font-size:13px;
    box-shadow:0 4px 12px rgba(0,0,0,.3); z-index:100; opacity:0; pointer-events:none; transition:opacity .25s;
  }
  .toast.show{opacity:1;}
  .toast.error{background:var(--warn);}


  .photo-btn{background:var(--blue);color:#fff;border:none;border-radius:6px;padding:11px 18px;font-weight:700;font-size:13px;cursor:pointer;}
  .photo-btn-alt{background:#fff;color:var(--blue-dark);border:1px solid var(--blue);}
  .photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;}
  .photo-item{position:relative;border:1px solid var(--grey-line);border-radius:6px;padding:6px;background:#fcfcfc;}
  .photo-item img{width:100%;height:110px;object-fit:cover;border-radius:4px;display:block;margin-bottom:6px;}
  .photo-item input[type=text]{width:100%;border:1px solid var(--grey-line);border-radius:4px;padding:4px 6px;font-size:11px;font-family:inherit;}
  .photo-del{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.65);color:#fff;border:none;border-radius:50%;width:24px;height:24px;cursor:pointer;font-size:12px;}
  .pdoc-annex{margin-top:28px;border-top:2px dashed #ccc;padding-top:14px;}
  .pdoc-annex-title{text-align:center;color:#006FC0;font-weight:700;font-size:14px;margin-bottom:10px;}
  .pdoc-annex-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .pdoc-annex figure{margin:0;}
  .pdoc-annex img{width:100%;border:1px solid #ccc;display:block;}
  .pdoc-annex figcaption{font-size:9px;margin-top:3px;}


  header.topbar .save-status{font-size:11px;opacity:.9;white-space:nowrap;}
  header.topbar .save-status.warn{background:#fff3cd;color:#7a5b00;border-radius:4px;padding:2px 6px;opacity:1;}
  header.topbar button.btn-sec{background:rgba(255,255,255,.15);color:#fff;box-shadow:none;border:1px solid rgba(255,255,255,.4);}
  header.topbar button.btn-sec:hover{background:rgba(255,255,255,.28);}
  .manager-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:300;display:none;align-items:center;justify-content:center;padding:16px;}
  .manager-overlay.open{display:flex;}
  .manager-box{background:#fff;border-radius:10px;max-width:640px;width:100%;max-height:88vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.35);}
  .manager-head{background:var(--blue);color:#fff;padding:12px 16px;font-weight:700;display:flex;justify-content:space-between;align-items:center;}
  .manager-head button{background:none;border:none;color:#fff;font-size:20px;cursor:pointer;}
  .manager-actions{display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid #eee;}
  .manager-actions button{border-radius:6px;padding:9px 14px;font-weight:700;font-size:13px;cursor:pointer;border:1px solid var(--blue);background:var(--blue);color:#fff;}
  .manager-actions button.alt{background:#fff;color:var(--blue-dark);}
  #managerList{overflow:auto;padding:8px 16px 16px;}
  .mgr-row{display:flex;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid #eee;}
  .mgr-row.current{background:#f1f7fd;margin:0 -16px;padding:10px 16px;}
  .mgr-info{flex:1;min-width:0;}
  .mgr-title{font-weight:700;font-size:13.5px;}
  .mgr-sub{font-size:11.5px;color:#777;margin-top:2px;}
  .mgr-btn{border:1px solid var(--blue);background:#fff;color:var(--blue-dark);border-radius:6px;padding:7px 12px;font-size:12px;font-weight:700;cursor:pointer;}
  .mgr-del{border-color:#c0392b;color:#c0392b;}
  .mgr-empty{color:#888;font-size:13px;text-align:center;padding:18px 0;}

  .bottom-bar{
    position:fixed; left:0; right:0; bottom:0; z-index:60; background:#fff;
    border-top:1px solid var(--grey-line); box-shadow:0 -2px 8px rgba(0,0,0,.12);
    padding:10px 16px calc(10px + env(safe-area-inset-bottom)); display:flex; justify-content:center;
  }
  .bottom-bar button{
    background:var(--blue); color:#fff; border:none; border-radius:8px; padding:14px 32px;
    font-weight:700; font-size:15px; cursor:pointer; min-width:260px;
  }
  .bottom-bar button:hover{background:var(--blue-dark);}

  /* Preview overlay */
  .preview-overlay{
    position:fixed; inset:0; background:#e9ecef; z-index:200;
    display:none; flex-direction:column;
  }
  .preview-overlay.open{display:flex;}
  .preview-toolbar{
    background:var(--blue); color:#fff; padding:12px 20px calc(12px + env(safe-area-inset-bottom));
    display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;
    box-shadow:0 -2px 8px rgba(0,0,0,.2); z-index:2;
  }
  .preview-toolbar .ptitle{font-weight:700; font-size:14px;}
  .preview-toolbar .pactions{display:flex; gap:8px; flex-wrap:wrap;}
  .preview-toolbar button{
    border:none; border-radius:8px; padding:13px 20px; font-weight:700; font-size:14px; cursor:pointer;
  }
  .preview-toolbar .btn-edit{background:rgba(255,255,255,.15); color:#fff;}
  .preview-toolbar .btn-edit:hover{background:rgba(255,255,255,.25);}
  .preview-toolbar .btn-word{background:#fff; color:var(--blue-dark);}
  .preview-toolbar .btn-word:hover{background:#eef4fb;}
  .preview-toolbar .btn-pdf{background:#1a2b4a; color:#fff;}
  .preview-toolbar .btn-pdf:hover{background:#0f1a30;}
  .preview-toolbar .btn-new{background:#1C8A4B; color:#fff;}
  .preview-toolbar .btn-new:hover{background:#166f3c;}
  .preview-toolbar button:disabled{opacity:.6; cursor:default;}
  .preview-scroll{flex:1; overflow:auto; padding:24px;}
  #previewDoc, .pdoc-root{
    max-width:900px; margin:0 auto; background:#fff; padding:28px 34px;
    box-shadow:0 2px 10px rgba(0,0,0,.15); font-size:10.5px; color:#404040; font-family:Calibri,Arial,sans-serif;
  }
  .pdoc-header{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:6px;}
  .pdoc-header img{height:44px;}
  .pdoc-header .htext{text-align:right;}
  .pdoc-header .h1t{color:#006FC0; font-weight:700; font-size:11px;}
  .pdoc-header .h2t{color:#888; font-size:9.5px;}
  .pdoc-title{text-align:center; color:#006FC0; font-weight:700; font-size:14px; margin:8px 0 2px;}
  .pdoc-note{text-align:center; color:#006FC0; font-weight:700; font-size:8.5px; margin-bottom:10px;}

  table.pdoc-id{width:100%; border-collapse:collapse; font-size:9.5px; margin-bottom:0;}
  table.pdoc-id td{border:1px solid #000; padding:3px 6px;}
  table.pdoc-id td.lbl{background:#fff; font-weight:700; white-space:nowrap;}
  table.pdoc-id tr.banner td{background:#006FC0; color:#fff; font-weight:700; text-align:center; padding:4px;}
  .id-c1{width:14%;} .id-c2{width:36%;} .id-c3{width:19%;} .id-c4{width:31%;}

  table.pdoc-items{width:100%; border-collapse:collapse; font-size:9px; margin-top:8px;}
  table.pdoc-items th{background:#006FC0; color:#fff; padding:4px 3px; border:1px solid #000; font-size:9px;}
  table.pdoc-items td{border:1px solid #000; padding:3px 4px; vertical-align:middle;}
  table.pdoc-items td.ref{background:#d9d9d9; text-align:center; font-weight:700;}
  tr.cat-row td{background:#006FC0; color:#fff; font-weight:700; text-align:center;}
  tr.subcat-row td{background:#d9d9d9; font-style:italic; font-weight:700;}
  .col-ref{width:6.5%;} .col-item{width:57%;} .col-chk{width:4.2%; text-align:center;} .col-obs{width:16.8%;}
  .pdoc-footnote{font-size:8.5px; margin:3px 0 8px;}

  .pdoc-banner{background:#006FC0; color:#fff; font-weight:700; padding:4px 8px; font-size:10px; margin:10px 0 0;}
  table.pdoc-box{width:100%; border-collapse:collapse; font-size:9.5px; margin-bottom:0;}
  table.pdoc-box td{border:1px solid #000; padding:6px 8px; min-height:40px;}

  table.pdoc-sign{width:100%; border-collapse:collapse; font-size:9.5px; margin-top:0;}
  table.pdoc-sign td{border:1px solid #000; padding:4px 6px; vertical-align:top; width:25%;}
  table.pdoc-sign td.sig-cell{text-align:center; vertical-align:middle;}
  table.pdoc-sign .sig-hdr{font-weight:700;}
  table.pdoc-sign .sig-gap{background:#d9d9d9; height:8px;}
  .sig-preview-img{max-width:120px; max-height:45px;}
</style>
</head>
<body>

<header class="topbar">
  <div class="title">Check-list ERL Maquinaria<small>GESEME · Departamento Técnico</small></div>
  <div class="progress-wrap">
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-label" id="progressLabel">0 / 0</div>
  </div>
  <span id="saveStatus" class="save-status"></span>
  <button id="btnManager" class="btn-sec">Máquinas</button>
  <button id="btnNewMachine" class="btn-sec">+ Nueva</button>
</header>

<main id="app"></main>

<div class="bottom-bar">
  <button id="generateBtn">Vista previa</button>
</div>

<footer class="note">Herramienta offline de uso interno GESEME. Los datos se procesan localmente en el navegador; no se envían a ningún servidor.</footer>

<div class="toast" id="toast"></div>

<div class="manager-overlay" id="managerOverlay">
  <div class="manager-box">
    <div class="manager-head"><span>Evaluaciones guardadas en esta tablet</span><button id="mgrClose" aria-label="Cerrar">✕</button></div>
    <div class="manager-actions">
      <button id="mgrNewKeep">+ Nueva máquina (misma empresa)</button>
      <button id="mgrNewBlank" class="alt">+ Nueva en blanco</button>
    </div>
    <div id="managerList"></div>
  </div>
</div>

<div class="preview-overlay" id="previewOverlay">
  <div class="preview-scroll">
    <div id="previewDoc"></div>
  </div>
  <div class="preview-toolbar">
    <div class="ptitle">Vista previa del documento</div>
    <div class="pactions">
      <button class="btn-edit" id="btnEdit">← Seguir editando</button>
      <button class="btn-word" id="btnConfirmSign">Todo correcto, pasar a firmar →</button>
      <button class="btn-word" id="btnWord">Descargar Word</button>
      <button class="btn-pdf" id="btnPdf">Descargar PDF</button>
      <button class="btn-new" id="btnNewFromPreview">NUEVA MÁQUINA</button>
    </div>
  </div>

function el(tag, attrs={}, children=[]){
  const e = document.createElement(tag);
  Object.entries(attrs).forEach(([k,v])=>{
    if(k==='class') e.className = v;
    else if(k==='html') e.innerHTML = v;
    else e.setAttribute(k,v);
  });
  (Array.isArray(children)?children:[children]).forEach(c=>{
    if(c==null) return;
    e.appendChild(typeof c==='string'?document.createTextNode(c):c);
  });
  return e;
}

function setupSignaturePad(canvas, key){
  const ctx = canvas.getContext('2d');
  ctx.lineWidth = 5;
  ctx.lineCap = 'round';
  ctx.strokeStyle = '#1a2b4a';
  state.signaturePads[key] = {canvas, ctx, signed:false};
  if(state.sigData[key]){
    const img = new Image();
    img.onload = ()=>{ ctx.drawImage(img, 0, 0, canvas.width, canvas.height); state.signaturePads[key].signed = true; };
    img.src = state.sigData[key];
    state.signaturePads[key].signed = true;
  }

  let drawing = false;
  function pos(e){
    const rect = canvas.getBoundingClientRect();
    const cx = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
    const cy = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
    return [cx * (canvas.width/rect.width), cy * (canvas.height/rect.height)];
  }
  function start(e){
    e.preventDefault();
    drawing = true;
    const [x,y] = pos(e);
    ctx.beginPath();
    ctx.moveTo(x,y);
  }
  function move(e){
    if(!drawing) return;
    e.preventDefault();
    const [x,y] = pos(e);
    ctx.lineTo(x,y);
    ctx.stroke();
    state.signaturePads[key].signed = true;
  }
  function end(e){ if(drawing){ drawing = false; scheduleSave(); } }

  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  window.addEventListener('mouseup', end);
  canvas.addEventListener('touchstart', start, {passive:false});
  canvas.addEventListener('touchmove', move, {passive:false});
  canvas.addEventListener('touchend', end);
}

function clearSignaturePad(key){
  const pad = state.signaturePads[key];
  if(!pad) return;
  pad.ctx.clearRect(0,0,pad.canvas.width,pad.canvas.height);
  pad.signed = false;
  delete state.sigData[key];
  scheduleSave();
}

const PHOTO_MAX_PX = 1280;
const PHOTO_QUALITY = 0.78;

async function compressPhoto(file){
  let bmp;
  try{ bmp = await createImageBitmap(file); }
  catch(e){
    bmp = await new Promise((res,rej)=>{
      const img = new Image();
      img.onload = ()=>res(img); img.onerror = rej;
      img.src = URL.createObjectURL(file);
    });
  }
  const w0 = bmp.width, h0 = bmp.height;
  const k = Math.min(1, PHOTO_MAX_PX / Math.max(w0, h0));
  const w = Math.round(w0*k), h = Math.round(h0*k);
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const cx = c.getContext('2d');
  cx.fillStyle = '#fff'; cx.fillRect(0,0,w,h);
  cx.drawImage(bmp, 0, 0, w, h);
  return {dataUrl: c.toDataURL('image/jpeg', PHOTO_QUALITY), w, h, caption:''};
}

function photoAnnexWordXml(photos, rids){
  const EMU_MAXW = 5400000, EMU_MAXH = 3600000; // 15 cm x 10 cm
  let x = `<w:p><w:pPr><w:pageBreakBefore/><w:spacing w:after="120"/><w:jc w:val="center"/></w:pPr>`+
          `<w:r><w:rPr><w:b/><w:color w:val="006FC0"/><w:sz w:val="26"/></w:rPr><w:t>ANEXO FOTOGRÁFICO</w:t></w:r></w:p>`;
  photos.forEach((p,i)=>{
    let cx = EMU_MAXW, cy = Math.round(cx * p.h / p.w);
    if(cy > EMU_MAXH){ cy = EMU_MAXH; cx = Math.round(cy * p.w / p.h); }
    const id = 1000 + i;
    const cap = 'Foto '+(i+1)+(p.caption ? ' \u2013 '+escapeXml(p.caption) : '');
    x += `<w:p><w:pPr><w:keepNext/><w:spacing w:before="160" w:after="40"/><w:jc w:val="center"/></w:pPr><w:r><w:drawing>`+
      `<wp:inline distT="0" distB="0" distL="0" distR="0"><wp:extent cx="${cx}" cy="${cy}"/><wp:effectExtent l="0" t="0" r="0" b="0"/>`+
      `<wp:docPr id="${id}" name="FotoAnexo${i+1}"/>`+
      `<wp:cNvGraphicFramePr><a:graphicFrameLocks xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" noChangeAspect="1"/></wp:cNvGraphicFramePr>`+
      `<a:graphic xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture">`+
      `<pic:pic xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:nvPicPr><pic:cNvPr id="${id}" name="foto${i+1}.jpg"/><pic:cNvPicPr/></pic:nvPicPr>`+
      `<pic:blipFill><a:blip r:embed="${rids[i]}"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill>`+
      `<pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr></pic:pic>`+
      `</a:graphicData></a:graphic></wp:inline></w:drawing></w:r></w:p>`+
      `<w:p><w:pPr><w:spacing w:after="120"/><w:jc w:val="center"/></w:pPr><w:r><w:rPr><w:color w:val="404040"/><w:sz w:val="18"/></w:rPr><w:t xml:space="preserve">${cap}</w:t></w:r></w:p>`;
  });
  return x;
}

// Añade las fotos como anexo al final del documento (antes del sectPr final). No toca nada anterior.
async function addPhotoAnnexToZip(zip, xml, photos){
  if(!photos || !photos.length) return xml;
  let rels = await zip.file('word/_rels/document.xml.rels').async('string');
  let ct = await zip.file('[Content_Types].xml').async('string');
  const rids = [];
  let newRels = '';
  photos.forEach((p,i)=>{
    const rid = 'rId'+(300+i);
    rids.push(rid);
    zip.file('word/media/foto_anexo_'+(i+1)+'.jpg', p.dataUrl.split(',')[1], {base64:true});
    newRels += `<Relationship Id="${rid}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/foto_anexo_${i+1}.jpg"/>`;
  });
  rels = rels.replace('</Relationships>', newRels + '</Relationships>');
  zip.file('word/_rels/document.xml.rels', rels);
  if(!/Extension="jpe?g"/i.test(ct)){
    ct = ct.replace('<Default ', '<Default Extension="jpg" ContentType="image/jpeg"/><Default ');
    zip.file('[Content_Types].xml', ct);
  } else if(!/Extension="jpg"/i.test(ct)){
    ct = ct.replace('<Default ', '<Default Extension="jpg" ContentType="image/jpeg"/><Default ');
    zip.file('[Content_Types].xml', ct);
  }
  const at = xml.lastIndexOf('<w:sectPr');
  if(at < 0) throw new Error('No se encontró sectPr en el documento');
  const annexXml = photoAnnexWordXml(photos, rids);
  // El documento termina con un párrafo vacío tras la tabla de firmas. Si queda solo en una página nueva
  // genera una hoja en blanco antes del anexo, así que el anexo ocupa su lugar (el párrafo vacío es invisible).
  const trailing = xml.slice(0, at).match(/<w:p\b[^>]*\/>$/);
  if(trailing){
    return xml.slice(0, at - trailing[0].length) + annexXml + xml.slice(at);
  }
  return xml.slice(0, at) + annexXml + xml.slice(at);
}

// Guardado de progreso en la tablet (IndexedDB) + gestión de varias máquinas
// ============================================================
const DB_NAME = 'geseme_checklist_maquinaria', DB_VER = 1;
let dbPromise = null, persistOK = true, currentId = null, saveTimer = null, restoring = false, saveChain = Promise.resolve();

function openDB(){
  if(dbPromise) return dbPromise;
  dbPromise = new Promise((res,rej)=>{
    if(!window.indexedDB){ rej(new Error('IndexedDB no disponible')); return; }
    const rq = indexedDB.open(DB_NAME, DB_VER);
    rq.onupgradeneeded = ()=>{
      const db = rq.result;
      if(!db.objectStoreNames.contains('evals')) db.createObjectStore('evals',{keyPath:'id'});
      if(!db.objectStoreNames.contains('meta')) db.createObjectStore('meta',{keyPath:'id'});
    };
    rq.onsuccess = ()=>res(rq.result);
    rq.onerror = ()=>rej(rq.error);
    rq.onblocked = ()=>rej(new Error('IndexedDB bloqueada'));
  });
  return dbPromise;
}
function idbReq(rq){ return new Promise((res,rej)=>{ rq.onsuccess=()=>res(rq.result); rq.onerror=()=>rej(rq.error); }); }
async function dbPut(rec, meta){
  const db = await openDB();
  return new Promise((res,rej)=>{
    const tx = db.transaction(['evals','meta'],'readwrite');
    tx.objectStore('evals').put(rec); tx.objectStore('meta').put(meta);
    tx.oncomplete = ()=>res(); tx.onerror = ()=>rej(tx.error); tx.onabort = ()=>rej(tx.error);
  });
}
async function dbGet(id){ const db = await openDB(); return idbReq(db.transaction('evals').objectStore('evals').get(id)); }
async function dbList(){ const db = await openDB(); return idbReq(db.transaction('meta').objectStore('meta').getAll()); }
async function dbDelete(id){
  const db = await openDB();
  return new Promise((res,rej)=>{
    const tx = db.transaction(['evals','meta'],'readwrite');
    tx.objectStore('evals').delete(id); tx.objectStore('meta').delete(id);
    tx.oncomplete = ()=>res(); tx.onerror = ()=>rej(tx.error);
  });
}

function newId(){ return 'ev_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function answeredCount(){ return Object.keys(state.answers).filter(k=>state.answers[k]).length; }

function hasContent(){
  const carried = state.carried || {};
  const h = state.header || {};
  const headerFilled = Object.keys(h).some(k=>{
    const v = (h[k]||'').trim();
    if(!v) return false;
    if(k==='EMPRESA_CENTRO' && v === (carried.empresa||'')) return false;
    return true;
  });
  const obsFilled = Object.values(state.obs).some(v=>v && v.trim());
  const sigFilled = Object.values(state.signatures).some((v,i)=>v && v.trim() && !(Object.keys(state.signatures)[i]==='NOMBRE_GESEME' && v===(carried.tecnico||'')));
  const signed = Object.values(state.signaturePads).some(p=>p.signed) || Object.keys(state.sigData).length>0;
  return headerFilled || answeredCount()>0 || obsFilled || (state.obsGeneral||'').trim() || state.photos.length>0 || sigFilled || signed;
}

function collectSnapshot(){
  const sigData = {...state.sigData};
  Object.keys(state.signaturePads).forEach(k=>{
    const p = state.signaturePads[k];
    if(p.signed) sigData[k] = p.canvas.toDataURL('image/png'); else delete sigData[k];
  });
  return {
    id: currentId, updated: Date.now(),
    header: {...state.header}, answers: {...state.answers}, obs: {...state.obs},
    obsGeneral: state.obsGeneral, signatures: {...state.signatures},
    photos: state.photos.map(p=>({...p})), signatureUnlocked: state.signatureUnlocked,
    sigData, exported: state.exported, carried: state.carried,
  };
}

function setSaveStatus(txt, warn){
  const s = document.getElementById('saveStatus');
  if(!s) return;
  s.textContent = txt; s.classList.toggle('warn', !!warn);
}
function hhmm(ts){ const d = new Date(ts); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }

function scheduleSave(){
  if(restoring || !persistOK) return;
  setSaveStatus('Guardando…');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveNow, 700);
}

function saveNow(){
  clearTimeout(saveTimer); saveTimer = null;
  if(!persistOK || restoring) return saveChain;
  saveChain = saveChain.then(async ()=>{
    if(!currentId && !hasContent()){ setSaveStatus('Sin cambios'); return; }
    if(!currentId) currentId = newId();
    const rec = collectSnapshot();
    const meta = {id: rec.id, updated: rec.updated, equipo: rec.header.EQUIPO||'', empresa: rec.header.EMPRESA_CENTRO||'',
                  answered: answeredCount(), total: ALL_ITEMS.length, photos: rec.photos.length, exported: rec.exported};
    try{ await dbPut(rec, meta); setSaveStatus('💾 Guardado '+hhmm(rec.updated)); }
    catch(err){
      console.error(err); persistOK = false;
      setSaveStatus('⚠ Sin guardado', true);
      showToast('No se pudo guardar el progreso en este navegador. Genera el documento antes de cerrar.', true);
    }
  });
  return saveChain;
}

function applySnapshot(rec){
  restoring = true;
  state.header = rec.header || {}; state.answers = rec.answers || {}; state.obs = rec.obs || {};
  state.obsGeneral = rec.obsGeneral || ''; state.signatures = rec.signatures || {};
  state.photos = rec.photos || []; state.signatureUnlocked = !!rec.signatureUnlocked;
  state.sigData = rec.sigData || {}; state.exported = rec.exported || null; state.carried = rec.carried || null;
  currentId = rec.id;
  buildApp();
  restoring = false;
}

function startNewMachine(keepCompany){
  const prev = {empresa: (state.header.EMPRESA_CENTRO||'').trim(), tecnico: (state.signatures.NOMBRE_GESEME||'').trim()};
  restoring = true;
  state.header = {}; state.answers = {}; state.obs = {}; state.obsGeneral = ''; state.signatures = {};
  state.photos = []; state.signatureUnlocked = false; state.sigData = {}; state.exported = null; state.carried = null;
  if(keepCompany){
    if(prev.empresa) state.header.EMPRESA_CENTRO = prev.empresa;
    if(prev.tecnico) state.signatures.NOMBRE_GESEME = prev.tecnico;
    state.carried = prev;
  }
  currentId = null;
  buildApp();
  restoring = false;
  window.scrollTo(0,0);
}

// Generación del documento Word
// ============================================================
function escapeXml(str){
  if(!str) return '';
  return String(str)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&apos;')
    .replace(/[\r\n]+/g,' / ');
}

function buildPlaceholderMap(){
  const map = {};
  HEADER_FIELDS.forEach(f=>{ map[f.key] = escapeXml(state.header[f.key] || ''); });
  map['OBS_GENERAL'] = escapeXml(state.obsGeneral || '');
  SIGNATURE_FIELDS.forEach(f=>{ map[f.key] = escapeXml(state.signatures[f.key] || ''); });

  ALL_ITEMS.forEach(item=>{
    const tb = tokenBase(item.ref);
    const ans = state.answers[item.ref] || '';
    ['SI','NO','CP','NA'].forEach(v=>{
      map[tb+'_'+v] = (ans===v) ? 'X' : '';
    });
    map[tb+'_OBS'] = escapeXml(state.obs[item.ref] || '');
  });
  return map;
}

function showToast(msg, isError){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show'+(isError?' error':'');
  setTimeout(()=>{ t.className = 'toast'; }, 3200);
}

function base64ToUint8Array(b64){
  const raw = atob(b64);
  const arr = new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++) arr[i] = raw.charCodeAt(i);
  return arr;
}

async function generateDocx(){
  const btn = document.getElementById('btnWord');
  btn.disabled = true;
  const originalLabel = btn.textContent;
  btn.textContent = 'Generando...';
  try{
    const b64 = document.getElementById('template-b64').textContent.trim();
    const bytes = base64ToUint8Array(b64);
    const zip = await JSZip.loadAsync(bytes);
    let xml = await zip.file('word/document.xml').async('string');

    const map = buildPlaceholderMap();
    xml = xml.replace(/\{\{([A-Za-z0-9_]+)\}\}/g, (match, key)=>{
      return Object.prototype.hasOwnProperty.call(map, key) ? map[key] : '';
    });

    xml = await addPhotoAnnexToZip(zip, xml, state.photos);
    zip.file('word/document.xml', xml);

    // Embed drawn signatures (only for pads the user actually signed)
    for(const f of SIGNATURE_FIELDS){
      if(!f.sigFile) continue;
      const pad = state.signaturePads[f.key];
      if(pad && pad.signed){
        const blob = await new Promise(res=>pad.canvas.toBlob(res, 'image/png'));
        const buf = await blob.arrayBuffer();
        zip.file(f.sigFile, buf);
      }
    }

    const blob = await zip.generateAsync({type:'blob', mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});

    const equipoName = (state.header.EQUIPO || 'equipo').trim().replace(/[^a-zA-Z0-9\u00C0-\u017F ]/g,'').replace(/\s+/g,'_') || 'equipo';
    const today = new Date();
    const dateStr = today.getFullYear()+String(today.getMonth()+1).padStart(2,'0')+String(today.getDate()).padStart(2,'0');
    const filename = 'ERL_Maquinaria_'+equipoName+'_'+dateStr+'.docx';

    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 4000);

    state.exported = Date.now(); scheduleSave();
    showToast('Documento generado: '+filename, false);
  }catch(err){
    console.error(err);
    showToast('Error al generar el documento: '+err.message, true);
  }finally{
    btn.disabled = false;
    btn.textContent = originalLabel;
  }
}

// Anexo fotográfico en el PDF: páginas independientes tras el documento, 2 columnas x 3 filas por página
function addPhotoAnnexToPdf(pdf){
  if(!state.photos.length) return;
  const PW = pdf.internal.pageSize.getWidth(), PH = pdf.internal.pageSize.getHeight();
  const M = 12, GAP = 6, COLS = 2, ROWS = 3;
  const cellW = (PW - 2*M - GAP*(COLS-1)) / COLS;
  const top = 26, capH = 9;
  const cellH = (PH - top - M - GAP*(ROWS-1)) / ROWS;
  const imgBoxH = cellH - capH;
  const perPage = COLS*ROWS;
  state.photos.forEach((p,i)=>{
    const pos = i % perPage;
    if(pos === 0){
      pdf.addPage();
      pdf.setFont('helvetica','bold'); pdf.setFontSize(13); pdf.setTextColor(0,111,192);
      pdf.text('ANEXO FOTOGRÁFICO', PW/2, 16, {align:'center'});
      pdf.setFont('helvetica','normal'); pdf.setFontSize(8); pdf.setTextColor(120);
      const eq = (state.header.EQUIPO||'').trim();
      if(eq) pdf.text(eq, PW/2, 21, {align:'center'});
    }
    const col = pos % COLS, row = Math.floor(pos / COLS);
    const x0 = M + col*(cellW+GAP), y0 = top + row*(cellH+GAP);
    let w = cellW, h = w * p.h / p.w;
    if(h > imgBoxH){ h = imgBoxH; w = h * p.w / p.h; }
    pdf.addImage(p.dataUrl, 'JPEG', x0 + (cellW-w)/2, y0, w, h);
    pdf.setFont('helvetica','normal'); pdf.setFontSize(8); pdf.setTextColor(64);
    const cap = 'Foto '+(i+1)+(p.caption ? ' - '+p.caption : '');
    pdf.text(pdf.splitTextToSize(cap, cellW).slice(0,2), x0, y0 + imgBoxH + 4);
  });
}

// ------------------------------------------------------------
// PDF: se renderiza SIEMPRE a un ancho fijo tipo A4 (794 px = 210 mm a 96 dpi), independiente del tamaño de
// pantalla (iPhone, tablet, PC). Se pagina cortando entre filas y se captura página a página para no
// superar el límite de tamaño de lienzo de Safari/iOS.
// ------------------------------------------------------------
const PDF_STAGE_W = 794;
const PDF_PAGE_MM = {w:210, h:297, margin:8};

function waitImages(root){
  return Promise.all(Array.from(root.querySelectorAll('img')).map(img=>{
    if(img.complete && img.naturalWidth) return Promise.resolve();
    return new Promise(res=>{ img.onload = img.onerror = res; });
  }));
}

function computePageBreaks(stage, pageH){
  const top0 = stage.getBoundingClientRect().top;
  const total = Math.ceil(stage.getBoundingClientRect().height);
  const bottomOf = el => Math.round(el.getBoundingClientRect().bottom - top0);
  const candidates = new Set(), unsafe = new Set();
  stage.querySelectorAll('tr, table, .pdoc-banner, .pdoc-footnote, .pdoc-header, .pdoc-title, .pdoc-note').forEach(el=>{
    const b = bottomOf(el);
    candidates.add(b);
    // no cortar justo después de un título de bloque (quedaría huérfano al final de la página)
    if(el.matches('tr.cat-row, tr.subcat-row, tr.banner, .pdoc-banner, .pdoc-title, .pdoc-note, .pdoc-header')) unsafe.add(b);
  });
  // la nota (*) CP/NA va siempre pegada a la última fila de la tabla de ítems
  const itemsTable = stage.querySelector('table.pdoc-items');
  if(itemsTable){ const rows = itemsTable.querySelectorAll('tr'); if(rows.length) unsafe.add(bottomOf(rows[rows.length-1])); unsafe.add(bottomOf(itemsTable)); }
  // la tabla de firmas se mantiene entera en una página
  stage.querySelectorAll('table.pdoc-sign tr').forEach((tr,i,all)=>{ if(i < all.length-1) unsafe.add(bottomOf(tr)); });
  const safe = Array.from(candidates).filter(b=>!unsafe.has(b) && b>0 && b<total).sort((x,y)=>x-y);
  const segs = [];
  let start = 0;
  while(start < total - 1){
    const maxEnd = start + pageH;
    let end;
    if(maxEnd >= total) end = total;
    else {
      const ok = safe.filter(b=> b > start + 150 && b <= maxEnd);
      end = ok.length ? ok[ok.length-1] : maxEnd;
    }
    segs.push([start, end]);
    start = end;
  }
  return segs;
}

async function downloadPdf(){
  const btn = document.getElementById('btnPdf');
  const original = btn.textContent;
  btn.disabled = true; btn.textContent = 'Generando PDF...';
  const temp = [];
  try{
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF('p', 'mm', 'a4');

    // 1) Escenario fuera de la vista (queda tapado por la vista previa), con ancho fijo
    const holder = document.createElement('div');
    holder.innerHTML = buildPreviewHTML();
    const main = holder.querySelector('#previewMain');
    main.removeAttribute('id');
    const stage = document.createElement('div');
    stage.className = 'pdoc-root';
    stage.style.cssText = 'position:fixed;left:0;top:0;width:'+PDF_STAGE_W+'px;max-width:none;margin:0;box-shadow:none;z-index:-1;';
    stage.appendChild(main);
    document.body.appendChild(stage); temp.push(stage);
    await waitImages(stage);
    if(document.fonts && document.fonts.ready) await document.fonts.ready;

    // 2) Páginas: entre filas, alto útil = A4 menos márgenes
    const usableMm = PDF_PAGE_MM.h - 2*PDF_PAGE_MM.margin;
    const pageH = Math.floor(PDF_STAGE_W * usableMm / PDF_PAGE_MM.w);
    const segs = computePageBreaks(stage, pageH);

    // 3) Captura página a página (lienzos pequeños)
    for(let i=0;i<segs.length;i++){
      const [s,e] = segs[i];
      const wrap = document.createElement('div');
      wrap.style.cssText = 'position:fixed;left:0;top:0;width:'+PDF_STAGE_W+'px;height:'+(e-s)+'px;overflow:hidden;background:#fff;z-index:-1;';
      const clone = stage.cloneNode(true);
      clone.style.cssText = 'position:absolute;left:0;top:'+(-s)+'px;width:'+PDF_STAGE_W+'px;max-width:none;margin:0;box-shadow:none;';
      wrap.appendChild(clone);
      document.body.appendChild(wrap); temp.push(wrap);
      await waitImages(wrap);
      const canvas = await html2canvas(wrap, {scale:2, backgroundColor:'#ffffff', windowWidth:Math.max(PDF_STAGE_W, window.innerWidth), scrollX:0, scrollY:0, logging:false});
      document.body.removeChild(wrap); temp.pop();
      if(i>0) pdf.addPage();
      const hMm = canvas.height * PDF_PAGE_MM.w / canvas.width;
      pdf.addImage(canvas.toDataURL('image/jpeg', 0.92), 'JPEG', 0, PDF_PAGE_MM.margin, PDF_PAGE_MM.w, hMm);
    }

    addPhotoAnnexToPdf(pdf);

    const equipoName = (state.header.EQUIPO || 'equipo').trim().replace(/[^a-zA-Z0-9\u00C0-\u017F ]/g,'').replace(/\s+/g,'_') || 'equipo';
    const today = new Date();
    const dateStr = today.getFullYear()+String(today.getMonth()+1).padStart(2,'0')+String(today.getDate()).padStart(2,'0');
    pdf.save('ERL_Maquinaria_'+equipoName+'_'+dateStr+'.pdf');
    state.exported = Date.now(); scheduleSave();
    showToast('PDF generado correctamente', false);
  }catch(err){
    console.error(err);
    showToast('Error al generar el PDF: '+err.message, true);
  }finally{
    temp.forEach(n=>{ if(n.parentNode) n.parentNode.removeChild(n); });
    btn.disabled = false; btn.textContent = original;
  }
}

document.getElementById('generateBtn').addEventListener('click', openPreview);

document.getElementById('btnConfirmSign').addEventListener('click', confirmAndUnlockSignatures);
document.getElementById('btnWord').addEventListener('click', generateDocx);
document.getElementById('btnPdf').addEventListener('click', downloadPdf);
document.getElementById('btnNewFromPreview').addEventListener('click', newMachineFromPreview);
document.getElementById('btnManager').addEventListener('click', openManager);
document.getElementById('btnNewMachine').addEventListener('click', ()=>newMachine(true));
document.getElementById('mgrClose').addEventListener('click', closeManager);
document.getElementById('mgrNewKeep').addEventListener('click', ()=>newMachine(true));
document.getElementById('mgrNewBlank').addEventListener('click', ()=>newMachine(false));
initPersistence();

</script>
